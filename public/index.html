<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17141b"><title>Hack the Brewery CTF</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body><div id="app"><div class="boot"><span class="brand-mark">HB</span><p>Opening the workshop…</p></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="challenge-dialog" class="dialog"></dialog><dialog id="image-viewer" class="image-viewer" aria-label="Challenge image viewer"><div class="image-viewer-head"><div class="image-viewer-caption" id="image-viewer-caption">Challenge image</div><div class="image-viewer-controls"><span class="image-viewer-zoom" id="image-viewer-zoom" aria-live="polite">100%</span><button type="button" class="icon-button" data-viewer-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button type="button" class="icon-button" data-viewer-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button><button type="button" class="icon-button" data-viewer-action="reset" aria-label="Fit image" title="Fit image">↺</button><button type="button" class="icon-button" data-viewer-action="close" aria-label="Close image viewer" title="Close">×</button></div></div><div class="image-viewer-stage" id="image-viewer-stage"><div class="image-viewer-canvas"><img id="image-viewer-image" alt=""></div></div></dialog><dialog id="auth-dialog" class="dialog auth-dialog"></dialog></body></html>
